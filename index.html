<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vibrate</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --accent: #7c5cff;
      --accent-2: #2dd4ff;
      --bg-0: #05060a;
      --bg-1: #0c0e18;
      --text: #f5f6ff;
      --muted: rgba(245, 246, 255, 0.55);
      --dim: rgba(245, 246, 255, 0.35);
      --hairline: rgba(255, 255, 255, 0.08);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 20%, rgba(124, 92, 255, 0.22), transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(45, 212, 255, 0.12), transparent 70%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, #000 30%, transparent 80%);
      z-index: -1;
      pointer-events: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 36px;
      user-select: none;
      padding: 32px 24px;
      position: relative;
    }

    #status {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--hairline);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color 0.3s ease, background 0.3s ease;
    }

    #status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 10px var(--accent-2);
      animation: statusBlink 1s ease-in-out infinite;
    }

    @keyframes statusBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .indicator-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .indicator-wrap::before,
    .indicator-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(124, 92, 255, 0.25);
      pointer-events: none;
    }

    .indicator-wrap::before {
      width: 100%;
      height: 100%;
      animation: ringFloat 4s ease-in-out infinite;
    }

    .indicator-wrap::after {
      width: 72%;
      height: 72%;
      border-color: rgba(45, 212, 255, 0.18);
      animation: ringFloat 4s ease-in-out infinite reverse;
    }

    @keyframes ringFloat {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    #indicator {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.55) 35%, rgba(124, 92, 255, 0.85) 70%, rgba(45, 212, 255, 0.7) 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.15) inset,
        0 0 30px rgba(124, 92, 255, 0.55),
        0 0 80px rgba(124, 92, 255, 0.35),
        0 0 140px rgba(45, 212, 255, 0.25);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, opacity 0.12s ease;
    }

    #indicator.pulse {
      transform: scale(1.18);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.25) inset,
        0 0 50px rgba(124, 92, 255, 0.85),
        0 0 120px rgba(124, 92, 255, 0.6),
        0 0 200px rgba(45, 212, 255, 0.45);
    }

    /* Expanding ripple synced with pulse */
    #indicator::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      opacity: 0;
      transform: scale(1);
    }

    #indicator.pulse::after {
      animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 0; transform: scale(2.2); }
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #toggle-btn {
      position: relative;
      padding: 16px 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 10px 30px rgba(0, 0, 0, 0.45);
      min-width: 168px;
    }

    #toggle-btn:active {
      transform: scale(0.96);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
      border-color: rgba(255, 255, 255, 0.28);
    }

    #wake-status {
      font-size: 12px;
      color: var(--dim);
      text-align: center;
      letter-spacing: 0.04em;
      max-width: 280px;
      line-height: 1.5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #wake-status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="status">Вибрация каждую секунду</div>
    <div class="indicator-wrap">
      <div id="indicator"></div>
    </div>
    <div class="controls">
      <button id="toggle-btn">Стоп</button>
      <div id="wake-status">Экран не будет гаснуть</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const haptic = tg?.HapticFeedback;
    const indicator = document.getElementById('indicator');
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('toggle-btn');
    const wakeStatusEl = document.getElementById('wake-status');

    let running = true;
    let intervalId = null;

    function vibrate() {
      // Telegram HapticFeedback — works in Telegram clients
      if (haptic) {
        haptic.impactOccurred('medium');
      }
      // Fallback: Web Vibration API for browsers that support it
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }

      // Visual pulse
      indicator.classList.add('pulse');
      setTimeout(() => indicator.classList.remove('pulse'), 100);
    }

    function startVibrating() {
      vibrate();
      intervalId = setInterval(vibrate, 1000);
    }

    function stopVibrating() {
      clearInterval(intervalId);
      intervalId = null;
    }

    toggleBtn.addEventListener('click', () => {
      running = !running;
      if (running) {
        startVibrating();
        toggleBtn.textContent = 'Стоп';
        statusEl.textContent = 'Вибрация каждую секунду';
      } else {
        stopVibrating();
        toggleBtn.textContent = 'Старт';
        statusEl.textContent = 'Пауза';
      }
    });

    // --- Screen Wake Lock ---
    // Prevents the screen from turning off while the app is active.
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        wakeStatusEl.textContent = 'Wake Lock не поддерживается';
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeStatusEl.textContent = 'Экран не будет гаснуть';
        wakeLock.addEventListener('release', () => {
          wakeStatusEl.textContent = 'Wake Lock снят';
        });
      } catch (err) {
        wakeStatusEl.textContent = 'Не удалось удержать экран';
      }
    }

    // Re-acquire wake lock when the page becomes visible again
    // (OS releases it when the page is hidden)
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // --- Init ---
    requestWakeLock();
    startVibrating();
  </script>
</body>
</html>
