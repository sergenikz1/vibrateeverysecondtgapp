<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vibrate</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #7c5cff;
      --accent-2: #4ad6ff;
      --accent-soft: rgba(124, 92, 255, 0.35);
      --bg-0: #07070d;
      --bg-1: #11101c;
      --text: #f5f6ff;
      --text-dim: rgba(245, 246, 255, 0.55);
      --text-muted: rgba(245, 246, 255, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(124, 92, 255, 0.28), transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(74, 214, 255, 0.18), transparent 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.5;
      pointer-events: none;
      z-index: -1;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 56px 24px 40px;
      user-select: none;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    #status {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      transition: color 0.3s ease;
    }

    .stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(124, 92, 255, 0.25);
      pointer-events: none;
    }

    .ring.r1 { width: 260px; height: 260px; opacity: 0.35; }
    .ring.r2 { width: 200px; height: 200px; opacity: 0.5; }
    .ring.r3 { width: 150px; height: 150px; opacity: 0.7; border-color: rgba(74, 214, 255, 0.3); }

    .ripple {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .ripple.go {
      animation: ripple 0.9s ease-out forwards;
    }

    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 0.7;
        border-color: var(--accent);
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
        border-color: var(--accent-2);
      }
    }

    #indicator {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d3c9ff 45%, var(--accent) 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.15) inset,
        0 0 40px 6px var(--accent-soft),
        0 18px 50px -10px rgba(124, 92, 255, 0.55);
      transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      animation: float 3.6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }

    #indicator.pulse {
      transform: scale(1.18);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.25) inset,
        0 0 80px 14px var(--accent-soft),
        0 18px 60px -8px rgba(124, 92, 255, 0.7);
    }

    #app.paused #indicator {
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #aab0c6 45%, #5a607a 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08) inset,
        0 18px 40px -12px rgba(0,0,0,0.6);
      animation-play-state: paused;
      transform: scale(0.92);
    }

    #app.paused .ring {
      border-color: rgba(255,255,255,0.08);
    }

    #app.paused #status {
      color: var(--text-dim);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    #toggle-btn {
      position: relative;
      min-width: 200px;
      padding: 16px 36px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #5a3dff 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        0 10px 30px -8px rgba(124, 92, 255, 0.6),
        0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    #toggle-btn:active {
      transform: scale(0.97);
      box-shadow:
        0 6px 18px -6px rgba(124, 92, 255, 0.5),
        0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    #app.paused #toggle-btn {
      background: linear-gradient(135deg, #2a2b3d 0%, #1a1b2a 100%);
      box-shadow:
        0 8px 24px -10px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    #wake-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      padding: 8px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      transition: color 0.3s ease;
    }

    #wake-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    #wake-status.warn::before {
      background: #facc15;
      box-shadow: 0 0 8px #facc15;
    }

    #wake-status.error::before {
      background: #f87171;
      box-shadow: 0 0 8px #f87171;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="title">Vibrate</div>
      <div id="status">Вибрация каждую секунду</div>
    </div>

    <div class="stage">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ripple" id="ripple"></div>
      <div id="indicator"></div>
    </div>

    <div class="controls">
      <button id="toggle-btn">Стоп</button>
      <div id="wake-status">Экран не будет гаснуть</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const haptic = tg?.HapticFeedback;
    const app = document.getElementById('app');
    const indicator = document.getElementById('indicator');
    const ripple = document.getElementById('ripple');
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('toggle-btn');
    const wakeStatusEl = document.getElementById('wake-status');

    let running = true;
    let intervalId = null;

    function vibrate() {
      // Telegram HapticFeedback — works in Telegram clients
      if (haptic) {
        haptic.impactOccurred('medium');
      }
      // Fallback: Web Vibration API for browsers that support it
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }

      // Visual pulse
      indicator.classList.add('pulse');
      setTimeout(() => indicator.classList.remove('pulse'), 120);

      // Ripple effect
      ripple.classList.remove('go');
      void ripple.offsetWidth;
      ripple.classList.add('go');
    }

    function startVibrating() {
      vibrate();
      intervalId = setInterval(vibrate, 1000);
    }

    function stopVibrating() {
      clearInterval(intervalId);
      intervalId = null;
    }

    toggleBtn.addEventListener('click', () => {
      running = !running;
      if (running) {
        startVibrating();
        toggleBtn.textContent = 'Стоп';
        statusEl.textContent = 'Вибрация каждую секунду';
        app.classList.remove('paused');
      } else {
        stopVibrating();
        toggleBtn.textContent = 'Старт';
        statusEl.textContent = 'Пауза';
        app.classList.add('paused');
      }
    });

    // --- Screen Wake Lock ---
    // Prevents the screen from turning off while the app is active.
    let wakeLock = null;

    function setWakeStatus(text, level) {
      wakeStatusEl.textContent = text;
      wakeStatusEl.classList.remove('warn', 'error');
      if (level === 'warn') wakeStatusEl.classList.add('warn');
      if (level === 'error') wakeStatusEl.classList.add('error');
    }

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        setWakeStatus('Wake Lock не поддерживается', 'warn');
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        setWakeStatus('Экран не будет гаснуть');
        wakeLock.addEventListener('release', () => {
          setWakeStatus('Wake Lock снят', 'warn');
        });
      } catch (err) {
        setWakeStatus('Не удалось удержать экран', 'error');
      }
    }

    // Re-acquire wake lock when the page becomes visible again
    // (OS releases it when the page is hidden)
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // --- Init ---
    requestWakeLock();
    startVibrating();
  </script>
</body>
</html>
