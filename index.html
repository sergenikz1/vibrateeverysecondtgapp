<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Vibrate</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      gap: 24px;
      user-select: none;
    }

    #status {
      font-size: 18px;
      opacity: 0.7;
      letter-spacing: 0.05em;
    }

    #indicator {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.05s ease, opacity 0.05s ease;
    }

    #indicator.pulse {
      transform: scale(1.3);
      opacity: 0.4;
    }

    #wake-status {
      font-size: 13px;
      opacity: 0.4;
      text-align: center;
      padding: 0 24px;
    }

    #toggle-btn {
      margin-top: 12px;
      padding: 12px 32px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.3);
      background: transparent;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #toggle-btn:active {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="status">Вибрация каждую секунду</div>
    <div id="indicator"></div>
    <button id="toggle-btn">Стоп</button>
    <div id="wake-status">Экран не будет гаснуть</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const haptic = tg?.HapticFeedback;
    const indicator = document.getElementById('indicator');
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('toggle-btn');
    const wakeStatusEl = document.getElementById('wake-status');

    let running = true;
    let intervalId = null;

    function vibrate() {
      // Telegram HapticFeedback — works in Telegram clients
      if (haptic) {
        haptic.impactOccurred('medium');
      }
      // Fallback: Web Vibration API for browsers that support it
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }

      // Visual pulse
      indicator.classList.add('pulse');
      setTimeout(() => indicator.classList.remove('pulse'), 100);
    }

    function startVibrating() {
      vibrate();
      intervalId = setInterval(vibrate, 1000);
    }

    function stopVibrating() {
      clearInterval(intervalId);
      intervalId = null;
    }

    toggleBtn.addEventListener('click', () => {
      running = !running;
      if (running) {
        startVibrating();
        toggleBtn.textContent = 'Стоп';
        statusEl.textContent = 'Вибрация каждую секунду';
      } else {
        stopVibrating();
        toggleBtn.textContent = 'Старт';
        statusEl.textContent = 'Пауза';
      }
    });

    // --- Screen Wake Lock ---
    // Prevents the screen from turning off while the app is active.
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        wakeStatusEl.textContent = 'Wake Lock не поддерживается';
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeStatusEl.textContent = 'Экран не будет гаснуть';
        wakeLock.addEventListener('release', () => {
          wakeStatusEl.textContent = 'Wake Lock снят';
        });
      } catch (err) {
        wakeStatusEl.textContent = 'Не удалось удержать экран';
      }
    }

    // Re-acquire wake lock when the page becomes visible again
    // (OS releases it when the page is hidden)
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // --- Init ---
    requestWakeLock();
    startVibrating();
  </script>
</body>
</html>
