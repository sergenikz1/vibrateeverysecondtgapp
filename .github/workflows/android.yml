name: Build Android TV APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RUTV_KEYSTORE_BASE64: ${{ secrets.RUTV_KEYSTORE_BASE64 }}
      RUTV_KEYSTORE_PASSWORD: ${{ secrets.RUTV_KEYSTORE_PASSWORD }}
      RUTV_KEY_ALIAS: ${{ secrets.RUTV_KEY_ALIAS }}
      RUTV_KEY_PASSWORD: ${{ secrets.RUTV_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.RUTV_KEYSTORE_BASE64 != ''
        run: |
          echo "$RUTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RUTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/RuTV-$(git rev-parse --short HEAD).apk"
          ls -la out

      # Квота на артефакты в аккаунте может быть исчерпана — это не повод
      # валить сборку: APK в таком случае берётся из релиза apk-latest.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RuTV-apk
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Основной канал доставки, пока исчерпана квота на артефакты Actions:
      # push и ручной запуск обновляют предрелиз apk-latest свежим APK.
      - name: Publish APK to apk-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest \
            --title "RuTV APK" \
            --notes "Автосборка клиента Rutube для ТВ. Обновляется ручным запуском workflow." \
            --prerelease
          gh release upload apk-latest android/out/*.apk --clobber
