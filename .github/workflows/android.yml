name: Build Android TV APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RUTV_KEYSTORE_BASE64: ${{ secrets.RUTV_KEYSTORE_BASE64 }}
      RUTV_KEYSTORE_PASSWORD: ${{ secrets.RUTV_KEYSTORE_PASSWORD }}
      RUTV_KEY_ALIAS: ${{ secrets.RUTV_KEY_ALIAS }}
      RUTV_KEY_PASSWORD: ${{ secrets.RUTV_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.RUTV_KEYSTORE_BASE64 != ''
        run: |
          echo "$RUTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RUTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/RuTV-$(git rev-parse --short HEAD).apk"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuTV-apk
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 30
